<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>CoachLab Live</title>
<style>
html,body{margin:0;height:100%;background:#0a1628;color:#fff;font-family:"Segoe UI",Tahoma,Arial,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}
h1{margin:0;font-size:20px;color:#f4c430}
p{margin:0;color:#cbd5e1;font-size:14px;line-height:1.8}
a{display:inline-block;margin-top:6px;background:#f4c430;color:#0a1628;text-decoration:none;font-weight:800;border-radius:10px;padding:10px 24px}
</style>
</head>
<body>
<div style="font-size:44px">📡</div>
<h1>لا اتصال بالإنترنت</h1>
<p>تحقق من الشبكة ثم أعد المحاولة. سنحاول تلقائياً كل 10 ثوانٍ.</p>
<a id="r" href="https://coachlab.ma/live-sessions/">أعد المحاولة</a>
<script>
(function () {
  var u = new URLSearchParams(location.search).get('u') || '';
  if (!/^https:\/\/([a-z0-9-]+\.)*coachlab\.ma\//i.test(u)) u = 'https://coachlab.ma/live-sessions/';
  var a = document.getElementById('r'); a.href = u;
  setInterval(function () { if (navigator.onLine) location.href = u; }, 10000);
  window.addEventListener('online', function () { location.href = u; });
})();
</script>
</body>
</html>
